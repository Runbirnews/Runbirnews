<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ڕوونبیر نیوز</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    header {
      background: #09264d;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 10px 0 0;
    }

    nav {
      background: white;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      color: #09264d;
      text-decoration: none;
      font-weight: bold;
      margin: 0 10px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px #0001;
    }

    .welcome h2 {
      color: #c62828;
      margin-top: 0;
    }

    #news {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .news-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #0001;
    }

    .category {
      color: #c62828;
      font-weight: bold;
      font-size: 14px;
    }

    .news-card h3 {
      color: #09264d;
      font-size: 21px;
      margin: 10px 0;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin-top: 15px;
    }

    .loading {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    footer {
      margin-top: 40px;
      background: #09264d;
      color: white;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📰 ڕوونبیر نیوز</h1>
  <p>نوێترین هەواڵ و زانیاری</p>
</header>

<nav>
  <a href="#">سەرەکی</a>
  <a href="#">سیاسەت</a>
  <a href="#">جیهان</a>
  <a href="#">وەرزش</a>
  <a href="#">ئابووری</a>
  <a href="#">کەلتوور</a>
</nav>

<main>

  <section class="welcome">
    <h2>بەخێربێیت بۆ ڕوونبیر نیوز</h2>
    <p>ئەمە ماڵپەڕی ڕۆژنامەوانیی ڕوونبیر نیوزە.</p>
  </section>

  <section id="news">
    <div class="loading">⏳ هەواڵەکان بار دەکرێن...</div>
  </section>

</main>

<footer>
  <p>© 2026 ڕوونبیر نیوز</p>
</footer>

<script>
  const sheetId = "1a55TvoEs4MrGeCZDNf81we9cmYYT37JfD72ftybYC5g";

  const sheetUrl =
    `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

  function safe(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function loadNews() {
    const container = document.getElementById("news");

    try {
      const response = await fetch(sheetUrl);
      const text = await response.text();

      const start = text.indexOf("{");
      const end = text.lastIndexOf("}") + 1;

      const data = JSON.parse(text.substring(start, end));
      const rows = data.table.rows || [];

      container.innerHTML = "";

      if (rows.length === 0) {
        container.innerHTML =
          '<div class="loading">هیچ هەواڵێک نییە.</div>';
        return;
      }

      rows.reverse().forEach(row => {
        const cells = row.c || [];

        // Forms response sheet:
        // 0 = Timestamp
        // 1 = ناونیشانی هەواڵ
        // 2 = بەشی هەواڵ
        // 3 = بەروار
        // 4 = دەقی هەواڵ

        const title = cells[1]?.v || "";
        const category = cells[2]?.v || "";
        const date = cells[3]?.v || "";
        const newsText = cells[4]?.v || "";

        if (!title && !newsText) return;

        const article = document.createElement("article");
        article.className = "news-card";

        article.innerHTML = `
          <div class="category">${safe(category)}</div>
          <h3>${safe(title)}</h3>
          <p>${safe(newsText)}</p>
          <div class="date">${safe(date)}</div>
        `;

        container.appendChild(article);
      });

    } catch (error) {
      console.error(error);

      container.innerHTML =
        '<div class="loading">❌ کێشەیەک ڕوویدا لە بارکردنی هەواڵەکان.</div>';
    }
  }

  loadNews();
</script>

</body>
</html>
