<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەڕێوەبردنی ڕوونبیر نیوز</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      color: #222;
    }

    header {
      background: #09264d;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #00000015;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #c62828;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #a91f1f;
    }

    .note {
      margin-top: 15px;
      padding: 12px;
      background: #fff3cd;
      border-radius: 8px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<header>
  <h1>📰 بەڕێوەبردنی ڕوونبیر نیوز</h1>
  <p>زیادکردنی هەواڵ</p>
</header>

<main class="container">

  <section class="box">

    <label for="title">ناونیشانی هەواڵ</label>
    <input
      id="title"
      type="text"
      placeholder="ناونیشانی هەواڵ بنووسە"
    >

    <label for="category">بەشی هەواڵ</label>
    <select id="category">
      <option>سیاسەت</option>
      <option>جیهان</option>
      <option>وەرزش</option>
      <option>ئابووری</option>
      <option>کەلتوور</option>
      <option>کۆمەڵایەتی</option>
    </select>

    <label for="date">بەروار</label>
    <input id="date" type="date">

    <label for="text">دەقی هەواڵ</label>
    <textarea
      id="text"
      placeholder="دەقی هەواڵ لێرە بنووسە..."
    ></textarea>

    <button onclick="saveNews()">
      📰 تۆمارکردنی هەواڵ
    </button>

    <div class="note">
      ⚠️ ئەمە قۆناغی تاقیکردنەوەی فۆڕمەکەیە.
      دواتر دەیکەین بە سیستەمێک کە هەواڵەکە بەڕاستی لە ماڵپەڕەکە بڵاو بکاتەوە.
    </div>

  </section>

</main>

<script>
function saveNews() {
  const title = document.getElementById("title").value;
  const category = document.getElementById("category").value;
  const date = document.getElementById("date").value;
  const text = document.getElementById("text").value;

  if (!title || !text) {
    alert("تکایە ناونیشان و دەقی هەواڵ پڕ بکەرەوە.");
    return;
  }

  alert("هەواڵەکە ئامادەی تۆمارکردنە.");
}
</script>

</body>
</html>
